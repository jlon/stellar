name: Docker Build and Publish

# Trigger conditions: only on version tags or manual trigger
on:
  push:
    tags:
      - 'v*.*.*'  # Keep the trigger aligned with release.yml
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Step 0: Free up disk space on runner
      - name: Free disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          
          # Remove unnecessary tools and libraries
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          
          # Clean apt cache
          sudo apt-get clean
          
          # Remove docker images
          docker system prune -af
          
          echo "=== Disk space after cleanup ==="
          df -h

      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Manual runs must select an existing vX.Y.Z tag; branch builds never
      # publish a release image.
      - name: Verify release tag and version consistency
        run: |
          case "$GITHUB_REF_NAME" in
            v*.*.*) ;;
            *) echo "Docker publishing must run from a vX.Y.Z tag, not $GITHUB_REF_NAME." >&2; exit 1 ;;
          esac
          bash build/verify-release-version.sh "${GITHUB_REF_NAME#v}"

      # The target runtime stage executes arm64 package installation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 2: Setup Docker buildx (for multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Extract metadata (tags, labels) for Docker
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Stable releases update latest; prereleases never do.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Step 5: Build and push Docker image
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Multi-platform build: support AMD64 and ARM64 (Apple M1/M2, AWS Graviton)
          platforms: linux/amd64,linux/arm64

      # Step 6: Assert both requested architectures were pushed to GHCR.
      - name: Verify multi-platform manifest
        run: |
          set -euo pipefail
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker buildx imagetools inspect --raw "$IMAGE" | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | contains(["amd64", "arm64"])
          ' >/dev/null

      # Step 7: Smoke test the published amd64 image. The Dockerfile validates
      # static linkage during every platform build; this also proves it starts.
      - name: Smoke test published amd64 image
        run: |
          set -euo pipefail
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          echo "Testing image: $IMAGE"
          docker pull --platform linux/amd64 "$IMAGE"

          cleanup() {
            docker logs stellar-smoke || true
            docker rm -f stellar-smoke || true
          }
          trap cleanup EXIT

          docker run -d --rm --name stellar-smoke -p 18080:8080 "$IMAGE"
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health >/dev/null; then
              echo "✅ Docker image started and /health passed"
              exit 0
            fi
            sleep 2
          done

          echo "❌ Docker image did not become healthy" >&2
          exit 1

      # Step 8: Generate build summary
      - name: Generate build summary
        run: |
          echo "## 🐳 Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Available Tags" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Image Digest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
