name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify-version:
    name: Verify Version Consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        run: bash build/verify-release-version.sh "${GITHUB_REF#refs/tags/v}"

  build-and-upload:
    name: Build and Upload Assets
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Setup Zig and cargo-zigbuild
        run: |
          set -euo pipefail
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          echo 'd45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  /tmp/zig.tar.xz' | sha256sum --check
          sudo tar -xf /tmp/zig.tar.xz -C /opt
          /opt/zig-linux-x86_64-0.13.0/zig version
          echo "/opt/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.23.4 --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Angular 21 requires Node >=20.19; use its supported Node 22 LTS line.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test backend
        working-directory: backend
        run: cargo test --locked

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watch=false

      - name: Build application (fully static musl release)
        run: SKIP_FRONTEND=0 SKIP_NPM_INSTALL=1 make build

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          test -f build/dist/bin/stellar
          test -x build/dist/bin/stellar
          for dir in conf data logs; do
            test -d "build/dist/$dir"
          done
          file build/dist/bin/stellar
          file build/dist/bin/stellar | grep -q 'statically linked'
          sha256sum --check build/dist/SHA256SUMS
          sha256sum --check build/dist/*.tgz.sha256
          sha256sum --check build/dist/*.deb.sha256
          dpkg-deb --info build/dist/*.deb >/dev/null
          dpkg-deb --contents build/dist/*.deb | grep -q '/lib/systemd/system/stellar.service'

      - name: Smoke test npm and tarball packages
        run: make npm-e2e

      - name: Extract CHANGELOG for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          CHANGELOG=$(awk "/## \[$VERSION\]/,/## \[/" CHANGELOG.md | sed '$d' | tail -n +2)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Please see the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo 'content<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # The release stays private until the Helm chart has been uploaded too.
      - name: Create draft release and upload binary packages
        uses: softprops/action-gh-release@v1
        with:
          name: Stellar ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Stellar ${{ github.ref_name }}

            ### What's New

            ${{ steps.changelog.outputs.content }}

            ### Installation

            #### Static Linux x86_64 package
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/stellar-${{ needs.verify-version.outputs.version }}-linux-amd64-musl.tar.gz
            tar -xzf stellar-${{ needs.verify-version.outputs.version }}-linux-amd64-musl.tar.gz
            cd stellar
            ./bin/stellar.sh start
            ```

            #### Docker (static binary; amd64/arm64)
            ```bash
            docker run -d -p 8080:8080 \
              -v "$(pwd)/data:/data" \
              ghcr.io/${{ github.repository }}:${{ needs.verify-version.outputs.version }}
            ```

            Persist `/data` with a volume or PVC. In zero-configuration mode, Stellar creates its database, logs, and signing secret there on first startup.
          files: |
            build/dist/stellar-${{ needs.verify-version.outputs.version }}-linux-amd64-musl.tar.gz
            build/dist/SHA256SUMS
            build/dist/stellar-server-${{ needs.verify-version.outputs.version }}.tgz
            build/dist/stellar-server-${{ needs.verify-version.outputs.version }}.tgz.sha256
            build/dist/stellar-server-${{ needs.verify-version.outputs.version }}-amd64.deb
            build/dist/stellar-server-${{ needs.verify-version.outputs.version }}-amd64.deb.sha256

  publish-helm-chart:
    name: Publish Helm Chart
    needs: [verify-version, build-and-upload]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Package Helm chart
        run: |
          cd deploy/chart
          helm package . --version ${{ needs.verify-version.outputs.version }}

      - name: Upload Helm chart to draft release
        uses: softprops/action-gh-release@v1
        with:
          files: deploy/chart/stellar-${{ needs.verify-version.outputs.version }}.tgz

  publish-release:
    name: Publish Verified Release
    needs: [build-and-upload, publish-helm-chart]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the completed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi

  # Docker image publishing is handled by docker-publish.yml, which runs in
  # parallel for the same version tag.
