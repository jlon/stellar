<nb-card>
  <nb-card-header>
    <div class="d-flex justify-content-between align-items-center">
      <span>角色管理</span>
      <button
        nbButton
        status="primary"
        size="small"
        (click)="openCreateRole()"
        [disabled]="!canCreateRole"
        ngxHasPermission="api:roles:create"
        >
        <nb-icon icon="plus-outline"></nb-icon>
        创建角色
      </button>
    </div>
  </nb-card-header>

  <nb-card-body>
    @if (loading) {
      <div class="text-center">
        <nb-spinner status="primary"></nb-spinner>
      </div>
    }

    @if (!loading && !hasListPermission) {
      <nb-alert status="warning">
        您暂无查看角色的权限，请联系管理员获取授权。
      </nb-alert>
    }

    @if (!loading && hasListPermission) {
      <angular2-smart-table
        [settings]="settings"
        [source]="source"
      ></angular2-smart-table>
    }
  </nb-card-body>
</nb-card>
