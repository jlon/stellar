<nb-card>
  <nb-card-header>
    <div class="d-flex justify-content-between align-items-center">
      <span>角色管理</span>
      <button
        nbButton
        status="primary"
        size="small"
        (click)="openCreateRole()"
        [disabled]="!canCreateRole"
        ngxHasPermission="api:roles:create"
      >
        <nb-icon icon="plus-outline"></nb-icon>
        创建角色
      </button>
    </div>
  </nb-card-header>

  <nb-card-body>
    <div *ngIf="loading" class="text-center">
      <nb-spinner status="primary"></nb-spinner>
    </div>

    <nb-alert *ngIf="!loading && !hasListPermission" status="warning">
      您暂无查看角色的权限，请联系管理员获取授权。
    </nb-alert>

    <angular2-smart-table
      *ngIf="!loading && hasListPermission"
      [settings]="settings"
      [source]="source"
    ></angular2-smart-table>
  </nb-card-body>
</nb-card>
