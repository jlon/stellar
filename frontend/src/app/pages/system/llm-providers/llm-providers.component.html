<nb-card>
  <nb-card-header>
    <div class="d-flex justify-content-between align-items-center">
      <span>LLM 提供商管理</span>
      <button
        nbButton
        status="primary"
        size="small"
        (click)="openCreateProvider()"
        [disabled]="!canCreate"
      >
        <nb-icon icon="plus-outline"></nb-icon>
        添加提供商
      </button>
    </div>
  </nb-card-header>

  <nb-card-body>
    <nb-alert status="info" *ngIf="!loading">
      LLM 提供商用于增强 Profile 根因分析。系统会使用已激活的提供商进行分析，
      支持 OpenAI、DeepSeek、通义千问等兼容 OpenAI API 的服务。
    </nb-alert>

    <div *ngIf="loading" class="text-center">
      <nb-spinner status="primary"></nb-spinner>
    </div>

    <nb-alert *ngIf="!loading && !hasListPermission" status="warning">
      您暂无查看 LLM 提供商的权限，请联系管理员获取授权。
    </nb-alert>

    <ng2-smart-table
      *ngIf="!loading && hasListPermission"
      [settings]="settings"
      [source]="source"
    ></ng2-smart-table>
  </nb-card-body>
</nb-card>
