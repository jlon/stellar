<nb-card class="organization-dialog">
  <nb-card-header>{{ mode === 'create' ? '创建组织' : '编辑组织' }}</nb-card-header>

  <nb-card-body>
    <form [formGroup]="form" novalidate>
      <!-- Code & Name (create mode) -->
      @if (mode === 'create') {
        <div class="form-row">
          <div class="form-group">
            <label class="label">组织代码</label>
            <input nbInput size="small" fullWidth formControlName="code" placeholder="小写字母、数字、下划线"
              [status]="form.get('code')?.invalid && form.get('code')?.touched ? 'danger' : 'basic'" />
          </div>
          <div class="form-group">
            <label class="label">组织名称</label>
            <input nbInput size="small" fullWidth formControlName="name" placeholder="组织名称"
              [status]="form.get('name')?.invalid && form.get('name')?.touched ? 'danger' : 'basic'" />
          </div>
        </div>
      }

      <!-- Name only (edit mode) -->
      @if (mode === 'edit') {
        <div class="form-row">
          <div class="form-group full">
            <label class="label">组织名称</label>
            <input nbInput size="small" fullWidth formControlName="name" placeholder="组织名称"
              [status]="form.get('name')?.invalid && form.get('name')?.touched ? 'danger' : 'basic'" />
          </div>
        </div>
      }

      <!-- Description -->
      <div class="form-row">
        <div class="form-group full">
          <label class="label">描述</label>
          <textarea nbInput size="small" fullWidth formControlName="description" placeholder="组织描述（可选）" rows="2"></textarea>
        </div>
      </div>

      <!-- Admin (edit mode) -->
      @if (mode === 'edit') {
        <div class="form-row">
          <div class="form-group full">
            <label class="label">管理员</label>
            <nb-select size="small" formControlName="admin_user_id" placeholder="选择管理员（可选）" fullWidth>
              @for (user of availableUsers; track trackByUserId($index, user)) {
                <nb-option [value]="user.id">
                  {{ user.username }} @if (user.email) {
                  <span class="hint">- {{ user.email }}</span>
                }
              </nb-option>
            }
          </nb-select>
        </div>
      </div>
    }
  </form>
</nb-card-body>

<nb-card-footer>
  <button class="cancel" nbButton ghost status="basic" size="small" (click)="cancel()">取消</button>
  <button nbButton status="primary" size="small" (click)="submit()" [disabled]="form.invalid">保存</button>
</nb-card-footer>
</nb-card>
