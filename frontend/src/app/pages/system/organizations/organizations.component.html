<nb-card [nbSpinner]="loading" nbSpinnerStatus="primary" nbSpinnerSize="medium" nbSpinnerMessage="加载中">
  <nb-card-header>
    <div class="d-flex justify-content-between align-items-center">
      <span>组织管理</span>
      <button
        nbButton
        ghost
        status="primary"
        size="small"
        (click)="openCreateOrganization()"
        [disabled]="!canCreateOrganization"
        ngxHasPermission="api:organizations:create"
        title="创建组织"
        aria-label="创建组织"
        >
        <nb-icon icon="plus-outline"></nb-icon>
      </button>
    </div>
  </nb-card-header>

  <nb-card-body>
    @if (!hasListPermission) {
      <nb-alert status="warning">
        您暂无查看组织的权限，请联系管理员获取授权。
      </nb-alert>
    }

    @if (hasListPermission) {
      <angular2-smart-table
        [settings]="settings"
        [source]="source"
      ></angular2-smart-table>
    }
  </nb-card-body>
</nb-card>
