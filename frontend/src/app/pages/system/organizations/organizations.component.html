<nb-card>
  <nb-card-header>
    <div class="d-flex justify-content-between align-items-center">
      <span>组织管理</span>
      <button
        nbButton
        status="primary"
        size="small"
        (click)="openCreateOrganization()"
        [disabled]="!canCreateOrganization"
        ngxHasPermission="api:organizations:create"
        >
        <nb-icon icon="plus-outline"></nb-icon>
        创建组织
      </button>
    </div>
  </nb-card-header>

  <nb-card-body>
    @if (loading) {
      <div class="text-center">
        <nb-spinner status="primary"></nb-spinner>
      </div>
    }

    @if (!loading && !hasListPermission) {
      <nb-alert status="warning">
        您暂无查看组织的权限，请联系管理员获取授权。
      </nb-alert>
    }

    @if (!loading && hasListPermission) {
      <angular2-smart-table
        [settings]="settings"
        [source]="source"
      ></angular2-smart-table>
    }
  </nb-card-body>
</nb-card>
