<nb-card class="user-dialog">
  <nb-card-header>{{ mode === 'create' ? '新增用户' : '编辑用户' }}</nb-card-header>

  <nb-card-body>
    <form [formGroup]="form" novalidate>
      <!-- Organization (Super Admin) -->
      @if (isSuperAdmin) {
        <div class="form-row">
          <div class="form-group full">
            <label class="label">所属组织</label>
            <nb-select size="small" formControlName="organizationId" placeholder="请选择组织" fullWidth
              [status]="form.get('organizationId')?.invalid && form.get('organizationId')?.touched ? 'danger' : 'basic'">
              @for (org of organizations; track org) {
                <nb-option [value]="org.id">{{ org.name }}</nb-option>
              }
            </nb-select>
          </div>
        </div>
      }

      <!-- Organization Display (Org Admin) -->
      @if (!isSuperAdmin && currentOrganization) {
        <div class="form-row">
          <div class="form-group full">
            <label class="label">所属组织</label>
            <input nbInput size="small" fullWidth [value]="currentOrganization.name" disabled />
          </div>
        </div>
      }

      <!-- Username & Email -->
      <div class="form-row">
        <div class="form-group">
          <label class="label">用户名</label>
          <input nbInput size="small" fullWidth formControlName="username" placeholder="用户名"
            [status]="form.get('username')?.invalid && form.get('username')?.touched ? 'danger' : 'basic'" />
        </div>
        <div class="form-group">
          <label class="label">邮箱</label>
          <input nbInput size="small" fullWidth type="email" formControlName="email" placeholder="邮箱地址"
            [status]="form.get('email')?.invalid && form.get('email')?.touched ? 'danger' : 'basic'" />
        </div>
      </div>

      <!-- Password & Confirm -->
      <div class="form-row">
        <div class="form-group">
          <label class="label">密码 @if (mode === 'edit') {
            <span class="hint">(留空不改)</span>
          }</label>
          <input nbInput size="small" fullWidth type="password" formControlName="password"
            [placeholder]="mode === 'create' ? '密码' : '留空不修改'"
            [status]="form.get('password')?.invalid && form.get('password')?.touched ? 'danger' : 'basic'" />
        </div>
        <div class="form-group">
          <label class="label">确认密码</label>
          <input nbInput size="small" fullWidth type="password" formControlName="confirmPassword" placeholder="再次输入"
            [status]="(form.get('confirmPassword')?.invalid || form.errors?.['passwordMismatch']) && form.get('confirmPassword')?.touched ? 'danger' : 'basic'" />
        </div>
      </div>

      <!-- Role -->
      <div class="form-row">
        <div class="form-group full">
          <label class="label">角色</label>
          <nb-select size="small" formControlName="roleIds" placeholder="选择角色（可多选）" multiple fullWidth
            [status]="form.get('roleIds')?.invalid && form.get('roleIds')?.touched ? 'danger' : 'basic'">
            @for (role of filteredRoles; track role) {
              <nb-option [value]="role.id">{{ role.name }}</nb-option>
            }
          </nb-select>
        </div>
      </div>
    </form>
  </nb-card-body>

  <nb-card-footer>
    <button class="cancel" nbButton ghost status="basic" size="small" (click)="cancel()">取消</button>
    <button nbButton status="primary" size="small" (click)="submit()" [disabled]="form.invalid || loading">保存</button>
  </nb-card-footer>
</nb-card>
