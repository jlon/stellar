<nb-card [nbSpinner]="loading" nbSpinnerStatus="primary" nbSpinnerSize="medium" nbSpinnerMessage="加载中">
  <nb-card-header>
    <div class="d-flex justify-content-between align-items-center">
      <span>用户管理</span>
      <button
        nbButton
        ghost
        status="primary"
        size="small"
        (click)="openCreateUser()"
        [disabled]="!canCreateUser"
        ngxHasPermission="api:users:create"
        title="新增用户"
        aria-label="新增用户"
        >
        <nb-icon icon="person-add-outline"></nb-icon>
      </button>
    </div>
  </nb-card-header>

  <nb-card-body>
    @if (!hasListPermission) {
      <nb-alert status="warning">
        您暂无查看用户的权限，请联系管理员进行授权。
      </nb-alert>
    }

    @if (hasListPermission) {
      <angular2-smart-table
        [settings]="settings"
        [source]="source"
      ></angular2-smart-table>
    }
  </nb-card-body>
</nb-card>
