<div class="row">
  <div class="col-12">
    <nb-card [nbSpinner]="loading" nbSpinnerStatus="primary" nbSpinnerMessage="加载中">
      <nb-card-header class="d-flex justify-content-between align-items-center">
        <h4>资源组使用情况</h4>
        <div class="d-flex align-items-center gap-2">
          <button
            nbButton
            ghost
            status="basic"
            size="small"
            (click)="toggleAutoRefresh()"
            [nbTooltip]="autoRefresh ? '关闭自动刷新' : '开启自动刷新'"
            [title]="autoRefresh ? '关闭自动刷新' : '开启自动刷新'"
            [attr.aria-pressed]="autoRefresh"
            [class.rg-refresh-active]="autoRefresh">
            <nb-icon [icon]="autoRefresh ? 'pause-circle-outline' : 'play-circle-outline'"></nb-icon>
          </button>
          <button
            nbButton
            ghost
            status="basic"
            size="small"
            (click)="refreshData()"
            [disabled]="loading"
            nbTooltip="刷新"
            title="刷新">
            <nb-icon icon="refresh-outline"></nb-icon>
          </button>
          <button
            nbButton
            ghost
            status="basic"
            size="small"
            (click)="goBack()"
            nbTooltip="返回资源组列表"
            title="返回资源组列表">
            <nb-icon icon="arrow-back-outline"></nb-icon>
          </button>
        </div>
      </nb-card-header>

      <nb-card-body>
        @if (autoRefresh) {
          <div class="mb-3">
            <nb-alert status="info" size="small">
              <nb-icon icon="info-outline"></nb-icon>
              自动刷新已开启，每 {{ refreshInterval }} 秒更新一次数据
            </nb-alert>
          </div>
        }

        <angular2-smart-table
          [settings]="settings"
          [source]="source"
        >
        </angular2-smart-table>

        @if (source.count() === 0) {
          <div class="text-center p-4">
            <nb-icon icon="inbox-outline" class="text-muted" style="font-size: 3rem;"></nb-icon>
            <p class="text-muted mt-2">当前没有资源组在使用资源</p>
          </div>
        }
      </nb-card-body>
    </nb-card>
  </div>
</div>
