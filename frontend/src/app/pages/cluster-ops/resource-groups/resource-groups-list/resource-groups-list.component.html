<div class="row">
  <div class="col-12">
    <nb-card [nbSpinner]="loading" nbSpinnerStatus="primary" [nbSpinnerMessage]="'加载中' | translate">
      <nb-card-body>
        <div class="card-toolbar">
          <div class="d-flex align-items-center gap-2">
            <button
              nbButton
              ghost
              status="basic"
              size="small"
              (click)="viewUsage()"
              [nbTooltip]="'使用情况' | translate"
              [title]="'使用情况' | translate">
              <nb-icon icon="activity-outline"></nb-icon>
            </button>
            <button
              nbButton
              ghost
              status="basic"
              size="small"
              (click)="viewAnalysis()"
              [nbTooltip]="'使用分析' | translate"
              [title]="'使用分析' | translate">
              <nb-icon icon="bar-chart-outline"></nb-icon>
            </button>
            <button
              nbButton
              ghost
              status="basic"
              size="small"
              (click)="createResourceGroup()"
              [nbTooltip]="'创建资源组' | translate"
              [title]="'创建资源组' | translate"
              [aria-label]="'创建资源组' | translate">
              <nb-icon icon="plus-outline"></nb-icon>
            </button>
          </div>
        </div>

        <angular2-smart-table
          [settings]="settings"
          [source]="source"
          (custom)="onCustomAction($event)"
        >
        </angular2-smart-table>
      </nb-card-body>
    </nb-card>
  </div>
</div>

<!-- 确认删除对话框模板 -->
<ng-template #deleteConfirmDialog let-data let-ref="dialogRef">
  <nb-card>
    <nb-card-header>{{ data.title }}</nb-card-header>
    <nb-card-body>
      <p>{{ data.message }}</p>
    </nb-card-body>
    <nb-card-footer class="d-flex justify-content-end">
      <button nbButton ghost status="basic" class="me-2" (click)="ref.close(false)">
        {{ '取消' | translate }}
      </button>
      <button nbButton status="danger" (click)="ref.close(true)">
        {{ '确认删除' | translate }}
      </button>
    </nb-card-footer>
  </nb-card>
</ng-template>
