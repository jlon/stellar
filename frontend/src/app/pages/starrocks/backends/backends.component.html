<div class="row">
  <div class="col-12">
    <nb-card [nbSpinner]="loading" nbSpinnerStatus="primary" nbSpinnerSize="medium" nbSpinnerMessage="加载中">
      <nb-card-header>
        <div class="d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-2">
            <h5 class="mb-0">{{ pageTitle }}</h5>
            <span class="text-hint">|</span>
            <span class="text-hint" style="font-size: 13px;">
              集群: <strong>{{ clusterName }}</strong>
            </span>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button nbButton
              status="primary"
              size="small"
              (click)="loadBackends()">
              <nb-icon icon="refresh-outline"></nb-icon>
            </button>
          </div>
        </div>
      </nb-card-header>
      <nb-card-body>
        <angular2-smart-table [settings]="settings" [source]="source" (deleteConfirm)="onDeleteConfirm($event)"></angular2-smart-table>
      </nb-card-body>
    </nb-card>
  </div>
</div>
