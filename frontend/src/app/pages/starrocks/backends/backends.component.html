<div class="row">
  <div class="col-12">
    <nb-card [nbSpinner]="loading" nbSpinnerStatus="primary" nbSpinnerSize="medium" [nbSpinnerMessage]="'加载中' | translate">
      <nb-card-body>
        <div class="card-toolbar">
          <div class="d-flex align-items-center gap-2">
            <button nbButton
              ghost
              status="basic"
              size="small"
              (click)="loadBackends()"
              [disabled]="loading"
              [nbTooltip]="'刷新' | translate"
              [title]="'刷新' | translate">
              <nb-icon icon="refresh-outline"></nb-icon>
            </button>
          </div>
        </div>

        <angular2-smart-table [settings]="settings" [source]="source" (deleteConfirm)="onDeleteConfirm($event)"></angular2-smart-table>
      </nb-card-body>
    </nb-card>
  </div>
</div>
