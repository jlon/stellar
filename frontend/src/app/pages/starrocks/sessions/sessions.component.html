<div class="row">
  <div class="col-12">
    <nb-card [nbSpinner]="loading" nbSpinnerStatus="primary" [nbSpinnerMessage]="'加载中' | translate">
      <nb-card-body>
        <div class="session-header-filters mb-3">
          <div class="session-toolbar">
            <div class="session-toolbar__controls" role="group" [aria-label]="'会话筛选与操作' | translate">
              <div class="session-toolbar__filters">
                <button
                  nbButton
                  ghost
                  size="small"
                  class="filter-toggle"
                  [class.filter-toggle--active]="sessionFilter.sleepOnly"
                  [attr.aria-pressed]="sessionFilter.sleepOnly"
                  (click)="toggleSleepFilter()"
                  [nbTooltip]="'仅显示睡眠连接' | translate"
                  [title]="'仅显示睡眠连接' | translate">
                  <nb-icon icon="moon-outline"></nb-icon>
                </button>
                <button
                  nbButton
                  ghost
                  size="small"
                  class="filter-toggle"
                  [class.filter-toggle--active]="sessionFilter.slowOnly"
                  [attr.aria-pressed]="sessionFilter.slowOnly"
                  (click)="toggleSlowFilter()"
                  [nbTooltip]="'仅显示慢会话（≥1分钟）' | translate"
                  [title]="'仅显示慢会话（≥1分钟）' | translate">
                  <nb-icon icon="clock-outline"></nb-icon>
                </button>
              </div>

              <div class="session-toolbar__actions">
                <button
                  nbButton
                  ghost
                  status="basic"
                  size="small"
                  (click)="clearSleepingConnections()"
                  [disabled]="loading"
                  [nbTooltip]="'清除睡眠连接' | translate"
                  [title]="'清除睡眠连接' | translate">
                  <nb-icon icon="power-outline"></nb-icon>
                </button>
                <button
                  nbButton
                  ghost
                  status="basic"
                  size="small"
                  (click)="batchKillAllSessions()"
                  [disabled]="loading"
                  [nbTooltip]="'批量查杀当前显示的会话' | translate"
                  [title]="'批量查杀当前显示的会话' | translate">
                  <nb-icon icon="trash-2-outline"></nb-icon>
                </button>
                <button
                  nbButton
                  ghost
                  status="basic"
                  size="small"
                  (click)="refresh()"
                  [disabled]="loading || !clusterId"
                  [nbTooltip]="'刷新' | translate"
                  [title]="'刷新' | translate">
                  <nb-icon icon="refresh-outline"></nb-icon>
                </button>
              </div>
            </div>
          </div>
        </div>

        <angular2-smart-table
          class="data-region"
          [settings]="settings"
          [source]="source"
          (deleteConfirm)="onDeleteConfirm($event)"
        ></angular2-smart-table>
      </nb-card-body>
    </nb-card>
  </div>
</div>
