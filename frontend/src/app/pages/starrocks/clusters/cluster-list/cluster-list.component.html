<div class="row">
  <div class="col-12">
    <nb-card [nbSpinner]="loading" nbSpinnerStatus="primary" [nbSpinnerMessage]="'加载中' | translate">
      <nb-card-header>
        <div class="d-flex justify-content-between align-items-center">
          <h6>{{  '集群列表' | translate }}</h6>
          <button nbButton ghost status="basic" size="small" (click)="onCreate()" [nbTooltip]="'添加集群' | translate" [title]="'添加集群' | translate" [aria-label]="'添加集群' | translate">
            <nb-icon icon="plus-outline"></nb-icon>
          </button>
        </div>
      </nb-card-header>
      <nb-card-body>
        <angular2-smart-table
          [settings]="settings"
          [source]="source"
          (edit)="onEdit($event)"
          (delete)="onDelete($event)"
          (userRowSelect)="onRowSelect($event)">
        </angular2-smart-table>
      </nb-card-body>
    </nb-card>
  </div>
</div>
