<section class="credential-management">
  <nb-card><nb-card-header>SSH 私钥凭据</nb-card-header><nb-card-body>
    <form [formGroup]="sshForm" (ngSubmit)="saveSsh()"><input nbInput formControlName="name" placeholder="凭据名称" /><input nbInput formControlName="username" placeholder="SSH 用户" /><textarea nbInput formControlName="private_key" rows="7" placeholder="未加密 OpenSSH 或 PEM 私钥"></textarea><button nbButton status="primary" type="submit" [disabled]="submitting">保存 SSH 凭据</button></form>
    <nb-list><nb-list-item *ngFor="let credential of sshCredentials"><strong>{{ credential.name }}</strong><span>{{ credential.username }}</span></nb-list-item></nb-list>
  </nb-card-body></nb-card>
  <nb-card><nb-card-header>StarRocks 运维账号</nb-card-header><nb-card-body>
    <form [formGroup]="databaseForm" (ngSubmit)="saveDatabase()"><input nbInput formControlName="name" placeholder="凭据名称" /><input nbInput formControlName="username" placeholder="数据库用户" /><input nbInput type="password" formControlName="password" placeholder="数据库密码" /><button nbButton status="primary" type="submit" [disabled]="submitting">保存运维账号</button></form>
    <nb-list><nb-list-item *ngFor="let credential of databaseCredentials"><strong>{{ credential.name }}</strong><span>{{ credential.username }}</span></nb-list-item></nb-list>
  </nb-card-body></nb-card>
</section>
