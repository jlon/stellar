<ng-container *ngIf="visible && !dismissed">
  <!-- 收起态：右下角气泡（hover 时右上角出现轻微八叉可关闭入口） -->
  <div *ngIf="!open" class="chat-fab-wrap">
    <button
      class="chat-fab-dismiss"
      (click)="dismiss()"
      [nbTooltip]="'关闭浮动入口（仍可从左侧「智能运维」使用）' | translate"
      nbTooltipPlacement="left"
    >
      <nb-icon icon="close-outline"></nb-icon>
    </button>
    <button class="chat-fab" (click)="toggle()" [nbTooltip]="'智能运维助手' | translate" nbTooltipPlacement="left">
      <nb-icon icon="activity-outline"></nb-icon>
    </button>
  </div>

  <!-- 展开态：迷你聊天窗 -->
  <div *ngIf="open" class="chat-float-panel">
    <header class="chat-float-header">
      <div class="float-title">
        <nb-icon icon="activity-outline"></nb-icon>
        <span>{{  '智能运维助手' | translate }}</span>
        <span class="float-cluster" *ngIf="clusterName">· {{ clusterName }}</span>
      </div>
      <div class="float-actions">
        <button nbButton ghost size="tiny" (click)="open = false" [nbTooltip]="'最小化' | translate">
          <nb-icon icon="chevron-down-outline"></nb-icon>
        </button>
        <button nbButton ghost size="tiny" (click)="visible = false" [nbTooltip]="'关闭' | translate">
          <nb-icon icon="close-outline"></nb-icon>
        </button>
      </div>
    </header>

    <div class="chat-float-sessions">
      <nb-select
        size="tiny"
        [selected]="activeSessionId"
        [placeholder]="'选择会话' | translate"
        [disabled]="!sessions.length"
        (selectedChange)="onSessionChange($event)"
        fullWidth
      >
        <nb-option *ngFor="let s of sessions" [value]="s.id">{{  s.title || ('(无标题)' | translate)  }}</nb-option>
        <nb-option [value]="null">{{  '＋ 新会话…' | translate }}</nb-option>
      </nb-select>
    </div>

    <div class="chat-float-messages">
      <div *ngIf="messages.length === 0" class="float-empty">
        <ngx-ai-illustration kind="float"></ngx-ai-illustration>
        <p>{{  '集群查询慢、磁盘紧、节点异常？先取证，再给结论' | translate }}</p>
      </div>

      <div *ngFor="let m of messages" class="float-row" [class.user]="m.role === 'user'">
        <div class="float-bubble" [class.user-bubble]="m.role === 'user'" [class.assistant-bubble]="m.role === 'assistant'">
          <div *ngIf="m.role === 'user'" class="float-content">{{ m.content }}</div>
          <markdown
            *ngIf="m.role === 'assistant' && (m.streaming ? m.liveText : m.content)"
            class="float-content markdown-body float-md"
            [data]="m.streaming ? m.liveText : m.content"
            [clipboard]="!m.streaming"
          ></markdown>
          <div *ngIf="m.role === 'assistant' && m.streaming && !m.liveText && !m.content" class="float-thinking">
            <nb-icon icon="loader-outline" class="float-spin"></nb-icon>
            <span>{{  '正在采集证据与推理…' | translate }}</span>
          </div>
          <div *ngIf="m.role === 'assistant' && m.stopped" class="float-stopped">{{  '已手动停止' | translate }}</div>
        </div>
        <div *ngIf="m.role === 'assistant' && !m.streaming && m.content" class="float-actions">
          <button class="float-mini" (click)="copyFloat(m)" [title]="'复制' | translate">
            <nb-icon [icon]="m.copied ? 'checkmark-outline' : 'copy-outline'"></nb-icon>
          </button>
          <button *ngIf="m.id" class="float-mini" [class.active]="m.feedback === 'up'" (click)="rateFloat(m, 'up')" [title]="'有帮助' | translate">
            <nb-icon icon="arrow-upward-outline"></nb-icon>
          </button>
          <button *ngIf="m.id" class="float-mini" [class.active]="m.feedback === 'down'" (click)="rateFloat(m, 'down')" [title]="'没帮助' | translate">
            <nb-icon icon="arrow-downward-outline"></nb-icon>
          </button>
        </div>
        <div *ngIf="m.role === 'user'" class="float-actions float-actions-user">
          <button class="float-mini" (click)="copyFloat(m)" [title]="'复制' | translate">
            <nb-icon [icon]="m.copied ? 'checkmark-outline' : 'copy-outline'"></nb-icon>
          </button>
        </div>
      </div>

      <div *ngFor="let a of pendingActions" class="float-action-card">
        <div class="float-action-head">
          <nb-icon icon="flash-outline"></nb-icon>
          <b>{{ a.title }}</b>
        </div>
        <div class="float-action-reason" *ngIf="a.reason">{{ a.reason }}</div>
        <div class="float-action-ops">
          <button nbButton size="tiny" status="success" (click)="confirmFloatAction(a)">{{  '确认并执行' | translate }}</button>
          <button nbButton size="tiny" status="danger" outline (click)="rejectFloatAction(a)">{{  '拒绝' | translate }}</button>
        </div>
      </div>

      <div *ngIf="sending" class="float-row">
        <div class="float-bubble assistant-bubble">
          <nb-icon icon="loader-outline" class="float-spin"></nb-icon>
          <span class="float-sending-text">{{  '正在取证分析…' | translate }}</span>
        </div>
      </div>
    </div>

    <footer class="chat-float-input">
      <textarea
        class="float-field"
        rows="1"
        [placeholder]="'问点关于集群的什么…' | translate"
        [(ngModel)]="input"
        (keydown)="onFloatKey($event)"
        (input)="autoGrowFloat($event)"
        [disabled]="sending"
      ></textarea>
      <button
        *ngIf="!sending"
        class="float-send"
        [disabled]="!input.trim()"
        (click)="send()"
        [nbTooltip]="'发送' | translate"
        nbTooltipPlacement="left"
      >
        <nb-icon icon="arrow-up-outline"></nb-icon>
      </button>
      <button
        *ngIf="sending"
        class="float-send float-stop"
        (click)="stopTurn()"
        [nbTooltip]="'停止生成' | translate"
        nbTooltipPlacement="left"
      >
        <nb-icon icon="stop-circle-outline"></nb-icon>
      </button>
    </footer>
  </div>
</ng-container>
