<div class="tab-bar">
  <div class="tab-container">
    @for (tab of tabs; track trackByTabId($index, tab)) {
      <div
        class="tab-item"
        [class.active]="tab.active"
        [class.pinned]="tab.pinned"
        (click)="onTabClick(tab)"
        (contextmenu)="onTabContextMenu(tab, $event)">
        <!-- 固定图标 -->
        @if (tab.pinned) {
          <nb-icon
            icon="pin-outline"
            class="pin-icon">
          </nb-icon>
        }
        <!-- Tab图标 -->
        @if (tab.icon && !tab.pinned) {
          <nb-icon
            [icon]="tab.icon"
            class="tab-icon">
          </nb-icon>
        }
        <!-- Tab标题 -->
        <span class="tab-title">{{ tab.title }}</span>
        <!-- 关闭按钮 -->
        @if (tab.closable) {
          <nb-icon
            icon="close-outline"
            class="close-icon"
            (click)="onCloseTab($event, tab.id)">
          </nb-icon>
        }
      </div>
    }
  </div>
</div>

@if (contextMenuVisible) {
  <div
    class="tab-context-menu"
    [style.left.px]="contextMenuX"
    [style.top.px]="contextMenuY"
    (contextmenu)="$event.preventDefault()">
    @for (item of contextMenuItems; track item) {
      <button
        type="button"
        class="menu-item"
        [class.disabled]="item.disabled"
        (click)="onContextMenuItemClick(item, $event)">
        <nb-icon [icon]="item.icon" [ngClass]="['menu-item-icon', 'icon-' + item.action]"></nb-icon>
        <span>{{ item.label }}</span>
      </button>
    }
  </div>
}
