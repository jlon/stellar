
@switch (kind) {
  <!-- ============ 对话助手：玻璃气泡 + 趋势折线 + 节点/参数悬浮卡 ============ -->
  @case ('chat') {
    <svg class="ai-illu" viewBox="0 0 320 230" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cB" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="var(--illu-accent)"/>
          <stop offset="1" stop-color="var(--illu-accent-2)"/>
        </linearGradient>
      </defs>
      <!-- 背景柔光 -->
      <!-- 可爱小机器人（整体缓浮） -->
      <g>
        <!-- 底座阴影 -->
        <ellipse cx="162" cy="198" rx="46" ry="9" fill="var(--illu-accent)" fill-opacity="0.12"/>
        <!-- 天线 -->
        <path d="M178 62 Q186 50 196 49" stroke="var(--illu-accent)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <circle cx="198" cy="47" r="6" fill="var(--illu-accent)"/>
        <circle cx="198" cy="47" r="11" stroke="var(--illu-accent)" stroke-opacity="0.35" stroke-width="2" fill="none"/>
        <!-- 头 -->
        <rect x="126" y="62" width="90" height="82" rx="32" fill="url(#cB)"/>
        <!-- 额头灯 -->
        <circle cx="171" cy="78" r="4" fill="#fff" fill-opacity="0.9"/>
        <!-- 眼（白底+主瞳+高光，带眨眼动画） -->
        <g>
          <ellipse cx="152" cy="98" rx="11" ry="13" fill="#fff"/>
          <circle cx="154" cy="99" r="6.5" fill="var(--illu-accent)" />
          <circle cx="156.5" cy="96.5" r="2.2" fill="#fff"/>
          <ellipse cx="190" cy="98" rx="11" ry="13" fill="#fff"/>
          <circle cx="192" cy="99" r="6.5" fill="var(--illu-accent)"/>
          <circle cx="194.5" cy="96.5" r="2.2" fill="#fff"/>
        </g>
        <!-- 微笑 -->
        <path d="M153 122 Q171 132 189 122" stroke="#fff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <!-- 脸颊 -->
        <circle cx="142" cy="112" r="5.5" fill="var(--illu-face)" fill-opacity="0.75"/>
        <circle cx="200" cy="112" r="5.5" fill="var(--illu-face)" fill-opacity="0.75"/>
        <!-- 身体 -->
        <rect x="136" y="146" width="70" height="46" rx="20" fill="var(--illu-card)" stroke="var(--illu-accent)" stroke-opacity="0.5" stroke-width="2.2"/>
        <!-- 前胸屏幕：迷你仪表（一个斜率小信号） -->
        <rect x="152" y="156" width="38" height="24" rx="8" fill="var(--illu-soft)" fill-opacity="0.7"/>
        <path class="illu-line" d="M158 174 L164 168 L170 172 L180 162" stroke="url(#cB)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="180" cy="162" r="3.4" fill="var(--illu-accent)"/>
        <!-- 臂（圆点手） -->
        <circle cx="122" cy="158" r="8" fill="var(--illu-card)" stroke="var(--illu-accent)" stroke-opacity="0.55" stroke-width="2.4"/>
        <circle cx="220" cy="158" r="8" fill="var(--illu-card)" stroke="var(--illu-accent)" stroke-opacity="0.55" stroke-width="2.4"/>
      </g>
      <!-- 左：对话气泡（打字点动画） -->
      <g>
        <path d="M74 92 L96 88 L88 100" fill="var(--illu-card)" stroke="var(--illu-line)" stroke-width="1.4" stroke-linejoin="round"/>
        <rect x="60" y="64" width="88" height="52" rx="18" fill="var(--illu-card)" stroke="var(--illu-line)" stroke-width="1.6"/>
        <circle cx="80" cy="90" r="5" fill="var(--illu-accent)"/>
        <circle cx="100" cy="90" r="5" fill="var(--illu-accent)"/>
        <circle cx="120" cy="90" r="5" fill="var(--illu-accent)"/>
      </g>
      <!-- 右：悬浮小卡（集群节点） -->
      <g>
        <rect x="236" y="100" width="58" height="46" rx="15" fill="var(--illu-card)" stroke="var(--illu-line)" stroke-width="1.4"/>
        <rect x="246" y="108" width="30" height="5" rx="2.5" fill="var(--illu-soft)"/>
        <circle cx="251" cy="126" r="6" fill="var(--illu-ok)"/>
        <circle cx="267" cy="126" r="6" fill="var(--illu-ok)"/>
        <circle cx="283" cy="126" r="6" fill="var(--illu-ok)"/>
      </g>
      <!-- 装饰 -->
      <circle cx="86" cy="150" r="3.5" fill="var(--illu-accent-2)"/>
      <circle cx="256" cy="72" r="3" fill="var(--illu-accent)"/>
      <circle cx="112" cy="44" r="2.6" fill="var(--illu-accent-2)"/>
    </svg>
  }
  <!-- ============ 事件中心：渐变铃铛 + 心跳 ============ -->
  @case ('incidents') {
    <svg class="ai-illu" viewBox="0 0 320 230" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="iB" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="var(--illu-accent)"/>
          <stop offset="1" stop-color="var(--illu-accent-2)"/>
        </linearGradient>
      </defs>
      <g>
        <!-- 铃身 -->
        <path d="M108 96 Q108 66 160 66 Q212 66 212 96" fill="var(--illu-card)" stroke="url(#iB)" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M118 96 L132 78 L188 78 L202 96 Z" fill="var(--illu-accent)" fill-opacity="0.16"/>
        <path d="M118 96 Q160 112 202 96" fill="none" stroke="url(#iB)" stroke-width="3.2" stroke-linecap="round"/>
        <circle cx="160" cy="118" r="7.5" fill="var(--illu-accent)"/>
        <path d="M160 108 L160 112" stroke="var(--illu-accent)" stroke-width="4" stroke-linecap="round"/>
      </g>
      <!-- 心跳线 -->
      <path d="M74 156 L104 156 L116 138 L128 170 L140 146 L154 156 L246 156" fill="none" stroke="url(#iB)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="illu-line"/>
      <circle cx="128" cy="170" r="5" fill="var(--illu-accent)"/>
      <!-- 悬浮卡：事件数 -->
      <g>
        <rect x="222" y="70" width="66" height="40" rx="13" fill="var(--illu-card)" stroke="var(--illu-line)" stroke-width="1.4"/>
        <rect x="232" y="80" width="30" height="5" rx="2.5" fill="var(--illu-soft)"/>
        <circle cx="270" cy="88" r="6" fill="var(--illu-warn)"/>
        <rect x="232" y="93" width="22" height="5" rx="2.5" fill="var(--illu-soft)"/>
      </g>
      <circle cx="96" cy="60" r="3.5" fill="var(--illu-accent-2)"/>
      <circle cx="248" cy="152" r="3" fill="var(--illu-accent)"/>
    </svg>
  }
  <!-- ============ 会话：层叠玻璃卡片 + 新建 ============ -->
  @case ('sessions') {
    <svg class="ai-illu" viewBox="0 0 320 230" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sB" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="var(--illu-accent)"/>
          <stop offset="1" stop-color="var(--illu-accent-2)"/>
        </linearGradient>
      </defs>
      <!-- 层叠卡 1 -->
      <g>
        <rect x="118" y="150" width="132" height="44" rx="14" fill="var(--illu-card)" stroke="var(--illu-line)" stroke-width="1.4" opacity="0.6"/>
        <circle cx="136" cy="172" r="6.5" fill="var(--illu-accent)" fill-opacity="0.35"/>
      </g>
      <!-- 层叠卡 2 -->
      <g>
        <rect x="104" y="122" width="144" height="44" rx="14" fill="var(--illu-card)" stroke="var(--illu-line)" stroke-width="1.4" opacity="0.8"/>
        <circle cx="122" cy="144" r="6.5" fill="var(--illu-accent)" fill-opacity="0.55"/>
      </g>
      <!-- 主卡 -->
      <g>
        <rect x="88" y="92" width="158" height="48" rx="15" fill="var(--illu-card)" stroke="var(--illu-line)" stroke-width="1.6"/>
        <circle cx="108" cy="116" r="8" fill="var(--illu-accent)"/>
        <path d="M105 116 L108 119 L112 113" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="124" y="106" width="66" height="6" rx="3" fill="var(--illu-accent)" fill-opacity="0.5"/>
        <rect x="124" y="120" width="42" height="5" rx="2.5" fill="var(--illu-soft)"/>
      </g>
      <!-- 新建按钮 -->
      <g>
        <circle cx="248" cy="86" r="20" fill="var(--illu-card)" stroke="url(#sB)" stroke-width="2.6"/>
        <path d="M248 78.5 V93.5 M240.5 86 H255.5" stroke="url(#sB)" stroke-width="2.6" stroke-linecap="round"/>
      </g>
      <circle cx="78" cy="60" r="3.5" fill="var(--illu-accent-2)"/>
      <circle cx="252" cy="160" r="3" fill="var(--illu-accent)"/>
    </svg>
  }
  <!-- ============ 浮窗：迷你聊天窗 + 发送光点 ============ -->
  @case ('float') {
    <svg class="ai-illu" viewBox="0 0 320 230" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fB" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="var(--illu-accent)"/>
          <stop offset="1" stop-color="var(--illu-accent-2)"/>
        </linearGradient>
      </defs>
      <!-- 迷你窗 -->
      <g>
        <rect x="74" y="66" width="172" height="108" rx="20" fill="var(--illu-card)" stroke="var(--illu-line)" stroke-width="1.6"/>
        <rect x="74" y="66" width="172" height="26" rx="20" fill="var(--illu-accent)" fill-opacity="0.07"/>
        <circle cx="90" cy="79" r="4" fill="var(--illu-accent)"/>
        <rect x="102" y="76.5" width="46" height="5.5" rx="2.75" fill="var(--illu-accent)" fill-opacity="0.5"/>
        <!-- 助手气泡 -->
        <rect x="88" y="102 " width="96" height="34" rx="12" fill="var(--illu-soft)" fill-opacity="0.6"/>
        <rect x="100" y="111" width="60" height="5" rx="2.5" fill="var(--illu-accent)" fill-opacity="0.4"/>
        <rect x="100" y="122" width="38" height="5" rx="2.5" fill="var(--illu-soft)"/>
        <!-- 用户气泡 -->
        <rect x="158" y="138" width="72" height="22" rx="11" fill="url(#fB)"/>
        <rect x="170" y="146" width="40" height="5" rx="2.5" fill="#fff" fill-opacity="0.85"/>
      </g>
      <!-- 发送光点 -->
      <g>
        <circle cx="78" cy="136" r="5" fill="var(--illu-accent)"/>
      </g>
      <!-- 圆形按钮 -->
      <g>
        <circle cx="252" cy="160" r="16" fill="var(--illu-accent)"/>
        <path d="M247 158 L252 153 L257 158" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <circle cx="92" cy="52" r="3.5" fill="var(--illu-accent-2)"/>
      <circle cx="262" cy="104" r="3" fill="var(--illu-accent)"/>
    </svg>
  }
}
