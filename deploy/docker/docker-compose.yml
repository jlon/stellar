services:
  stellar:
    image: stellar:latest
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    container_name: stellar
    ports:
      - "6060:9527"
    restart: unless-stopped
    # MinIO-style: everything lives in one data volume (stellar.db,
    # .jwt-secret, logs/). First startup prints a one-time admin password.
    # Optional: pin the JWT secret or the initial admin password.
    # environment:
    #   APP_JWT_SECRET: change-me-in-production
    #   APP_LLM_PROVIDER_ENCRYPTION_KEY: generate-with-openssl-rand-base64-32
    #   STELLAR_ROOT_PASSWORD: change-me-too
    volumes:
      - stellar-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9527/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  stellar-data:
