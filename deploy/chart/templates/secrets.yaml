{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (include "chart.fullname" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.jwtSecret }}
  jwt-secret: {{ .Values.jwtSecret | b64enc | quote }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.llmProviderEncryptionKey }}
  llm-provider-encryption-key: {{ .Values.llmProviderEncryptionKey | b64enc | quote }}
  {{- else if and $existingSecret (index $existingSecret.data "llm-provider-encryption-key") }}
  llm-provider-encryption-key: {{ index $existingSecret.data "llm-provider-encryption-key" | quote }}
  {{- else }}
  llm-provider-encryption-key: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
