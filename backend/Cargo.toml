[package]
name = "stellar"
version = "1.0.0"
edition = "2024"

[lib]
name = "stellar"
path = "src/lib.rs"

[profile.release]
strip = true
# fat LTO + 单 codegen unit 在不降低运行时优化级别或改变 panic 语义的前提下缩小静态发布包。
lto = "fat"
codegen-units = 1

[[bin]]
name = "stellar"
path = "src/main.rs"

# Lint configuration (following rustfs standard)
[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tokio = { version = "1", features = ["full"] }

# Database
# 同时启用 sqlite、mysql 与 postgres，运行时按 database.url 协议选择后端（见 db 模块）
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "mysql", "postgres", "migrate", "chrono"] }
mysql_async = "0.34"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication
jsonwebtoken = "9.2"
bcrypt = "0.15"

# HTTP client for StarRocks
reqwest = { version = "0.11", features = ["json", "stream", "native-tls-vendored"] }

# Configuration
dotenvy = "0.15"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# API documentation
utoipa = { version = "4.2", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# Utilities
once_cell = "1.19"
dashmap = "6.1"
urlencoding = "2.1"
uuid = { version = "1.6", features = ["v4"] }
async-trait = "0.1"
rand = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"

# Validation
validator = { version = "0.18", features = ["derive"] }

# 过程宏：数据库后端能力注入（#[app_db]）
stellar_macros = { path = "macros" }

# Regex
regex = "1.10"

# Access Control
casbin = "2.7"

# Static file embedding
rust-embed = "8.0"

# Command line argument parsing
clap = { version = "4.5", features = ["derive"] }

# Support log archive generation (Deflate only: no bzip2/zstd/aes needed)
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
